domain = "taxonomy"
schema_version = 1
required = true
one_role_per_path = true
overlapping_roles = "deny"
spaces_in_paths = "deny"
unknown_paths = "deny"

[role.cargo_configuration]
paths = [".cargo/"]

[role.documentation]
paths = ["docs/"]

[role.jig_configuration]
paths = [".jig/"]

[role.root_governance]
paths = [".editorconfig", ".gitattributes", ".gitignore", "Cargo.lock", "Cargo.toml", "LICENSE-MIT", "README.md", "TODO.md", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.json"]

[role.source]
paths = ["src/"]

[role.test]
paths = ["tests/"]
