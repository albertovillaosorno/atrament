domain = "versions"
schema_version = 1

[authority.getrandom]
current = "0.4.3"
stable = "0.4.3"

[authority.getrandom.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 1
provider = "crates-io"
source = "https://crates.io/api/v1/crates/getrandom"

[authority.getrandom.projection.manifest]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.dependencies.getrandom"
template = "={version}"

[authority.git]
current = "2.56.0"
stable = "2.56.0"

[authority.git.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 1
provider = "kernel-git-index"
source = "https://www.kernel.org/pub/software/scm/git/"

[authority.git.projection.tool]
kind = "tool"
target = "git"
template = "{version}"

[authority.jig]
current = "26.3.0"
stable = "26.3.0"

[authority.jig.projection.identity]
kind = "toml"
path = ".jig/version/jig.toml"
selector = "jig.version"
template = "{version}"

[authority.nix]
current = "0.31.3"
stable = "0.31.3"

[authority.nix.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 1
provider = "crates-io"
source = "https://crates.io/api/v1/crates/nix"

[authority.nix.projection.manifest]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.dependencies.nix.version"
template = "={version}"

[authority.pnpm]
current = "12.18.0"
stable = "12.18.0"

[authority.pnpm.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 30
provider = "npm-registry"
source = "https://registry.npmjs.org/pnpm/latest"

[authority.pnpm.projection.package_manager]
kind = "package-manager"
target = "pnpm"
template = "pnpm@{version}"

[authority.python]
current = "3.14.6"
stable = "3.14.6"

[authority.python.projection.tool]
kind = "tool"
target = "python"
template = "{version}"

[authority.rust-stable]
current = "1.99.1"
stable = "1.99.1"

[authority.rust-stable.projection.tool]
kind = "tool"
target = "rust_stable_cargo"
template = "{version}"

[authority.typescript]
current = "7.0.2"
stable = "7.0.2"

[authority.typescript.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 1
provider = "npm-registry"
source = "https://registry.npmjs.org/typescript/latest"

[authority.typescript.projection.package]
kind = "package"
target = "typescript"
template = "{version}"

[authority.unicode-segmentation]
current = "1.13.3"
stable = "1.13.3"

[authority.unicode-segmentation.freshness]
integrity_kind = "provider-response-sha256"
maximum_age_days = 30
provider = "crates-io"
source = "https://crates.io/api/v1/crates/unicode-segmentation"

[authority.unicode-segmentation.projection.manifest]
kind = "toml"
path = "Cargo.toml"
selector = "workspace.dependencies.unicode-segmentation"
template = "={version}"
