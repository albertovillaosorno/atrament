domain = "versions"
schema_version = 1

[authority.git-tool]
current = "2.54.0"
stable = "2.54.0"

[authority.git-tool.projection.tool]
kind = "tool"
target = "git"
template = "{version}"

[authority.jig]
current = "26.3.0"
stable = "26.3.0"

[authority.jig.projection.identity]
kind = "toml"
path = ".jig/version/jig.toml"
selector = "jig.version"
template = "{version}"

[authority.pnpm]
current = "11.22.0"
stable = "11.22.0"

[authority.pnpm.projection.package_manager]
kind = "package-manager"
target = "pnpm"
template = "pnpm@{version}"

[authority.typescript]
current = "7.0.2"
stable = "7.0.2"

[authority.typescript.projection.package]
kind = "package"
target = "typescript"
template = "{version}"

[authority.rust-stable-cargo]
current = "1.97.1"
stable = "1.97.1"

[authority.rust-stable-cargo.projection.tool]
kind = "tool"
target = "rust_stable_cargo"
template = "{version}"

[authority.clippy-nightly]
current = "0.1.99"
stable = "0.1.99"

[authority.clippy-nightly.projection.cargo_clippy]
kind = "tool"
target = "rust_nightly_cargo_clippy"
template = "{version}"

[authority.clippy-nightly.projection.clippy_driver]
kind = "tool"
target = "rust_nightly_clippy"
template = "{version}"
