[package]
name = "atrament_browser_launch"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
path = "adapter-outbound/lib.rs"

# Only the Linux opener needs group termination on launch failure.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["signal"] }

[lints]
workspace = true

[[test]]
name = "browser_launch_adapter"
path = "../../../tests/backend/browser-launch/adapter-outbound/lib.rs"
