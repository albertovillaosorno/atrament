[package]
name = "atrament_runtime_bootstrap"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../../LICENSE"

[dependencies]
atrament_notebook_profile = { workspace = true }
atrament_browser_launch = { workspace = true }
atrament_explicit_file_path_intent = { workspace = true }
atrament_profile_export_assembly = { workspace = true }
atrament_profile_file_commit = { workspace = true }
atrament_profile_local_file_read = { workspace = true }
atrament_profile_entry_sha256 = { workspace = true }
atrament_profile_import_preflight = { workspace = true }
atrament_profile_import_verification = { workspace = true }
atrament_profile_json_syntax = { workspace = true }
atrament_profile_manifest_json_codec = { workspace = true }
atrament_profile_manifest_json_writer = { workspace = true }
atrament_profile_open_file_import = { workspace = true }
atrament_profile_stored_zip_writer = { workspace = true }
atrament_profile_zip_reader = { workspace = true }
atrament_session_application = { workspace = true }
atrament_session_handshake = { workspace = true }
atrament_handwriting_statistics = { workspace = true }
atrament_handwriting_statistics_json = { workspace = true }
atrament_unicode_grapheme_segmentation = { workspace = true }
atrament_session_runtime = { workspace = true }
atrament_session_secret = { workspace = true }

# The crash-memory guard is Linux-only; keep other hosts dependency-free.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
atrament_profile_entry_sha256 = { workspace = true }

# Kernel memory and ptrace admission regressions only; no new production features.
[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true, features = ["process", "ptrace", "uio"] }

[[bin]]
name = "atrament"
path = "composition/main.rs"

[[test]]
name = "runtime_bootstrap_composition"
path = "../../../tests/backend/runtime-bootstrap/composition/lib.rs"

[lints]
workspace = true
